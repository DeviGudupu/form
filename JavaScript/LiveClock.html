<!DOCTYPE html>
<html>
    <body>
        <h1>Current time and date</h1>
        <p id="time"></p>
        <p id="date"></p>
        <script>
            function updateTime(){
                let now=new Date();
                document.getElementById("time").innerHTML=now.toLocaleTimeString();
                document.getElementById("date").innerHTML=now.toLocaleDateString();
            }
            setInterval(updateTime,1000);

            updateTime();
        </script>
    </body>
</html>
