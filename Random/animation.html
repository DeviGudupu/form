<html>
    <head>
        <title>Animation</title>
        <style>
            .box{
                width: 100px;
                height: 100px;
                background-color: red;
                position: relative;
                animation-name: moveBottom;
                animation-duration: 2s;
                animation-iteration-count: infinite;
                animation-direction: alternate;
                animation-timing-function: ease-in-out;
                border-radius: 50px;
            }
            @keyframes moveBottom{
                0% { top: 0;background-color: red;opacity: 0.1; }
                25% {top: 50px;background-color: orange;opacity: 0.1;}
                50% {top: 100px;background-color: yellow;opacity: 0.1;}
                75% {top: 150px;background-color: green;opacity: 0.1;}
                100% {top: 200px;background-color: blue;opacity: 0.1;}
            }
            .box:nth-child(2){
                animation-delay: 0.1s;
            }
            .box:nth-child(3){
                animation-delay: 0.3s;
            }
            .box:nth-child(4){
                animation-delay: 0.5s;
            }
            .box:nth-child(5){
                animation-delay: 0.7s;
            }
            .box:nth-child(6){
                animation-delay: 0.1s;
            }
            .box:nth-child(7){
                animation-delay: 0.9s;
            }
        </style>
    </head>
    <body>
        <div class="box"></div>
    </body>
</html>
