<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My Personal Dashboard — Offline</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --accent:#4f46e5; --muted:#666;
    --glass: rgba(255,255,255,0.6);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#eef2ff 0%,var(--bg) 100%);color:#111}
  .app{display:flex;min-height:100vh}
  /* Sidebar */
  .sidebar{width:78px;background:linear-gradient(180deg,var(--accent),#6d28d9);color:#fff;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .logo{width:48px;height:48px;border-radius:10px;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;font-weight:700}
  .navbtn{width:56px;height:56px;border-radius:10px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;cursor:pointer;opacity:0.9}
  .navbtn.active{background:rgba(255,255,255,0.12)}
  .navlabel{font-size:11px;margin-top:4px}
  /* Main */
  .main{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}
  header{display:flex;align-items:center;gap:12px}
  header h1{font-size:18px;margin:0}
  .container{display:grid;grid-template-columns:1fr;gap:12px}
  .card{background:var(--card);padding:12px;border-radius:12px;box-shadow:0 6px 18px rgba(10,10,20,0.06)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  input,textarea,select{width:100%;padding:8px;margin:6px 0;border-radius:8px;border:1px solid #e6e6ef;font-size:14px}
  button{cursor:pointer;padding:8px 10px;border-radius:8px;border:0;background:var(--accent);color:#fff}
  small{color:var(--muted)}
  .tiny{font-size:13px;color:var(--muted)}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #f0f0f4}
  .kpi{display:flex;gap:10px;align-items:center}
  .kpi .pill{background:linear-gradient(90deg,#eef2ff,#fff);padding:6px 10px;border-radius:999px;font-weight:600}
  .section-title{display:flex;justify-content:space-between;align-items:center}
  .flex{display:flex;gap:8px;align-items:center}
  /* responsive */
  @media (max-width:640px){
    .sidebar{width:64px;padding:10px}
    header h1{font-size:16px}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" aria-label="sidebar">
    <div class="logo" title="Dashboard">MD</div>

    <button class="navbtn active" data-section="dashboard" title="Dashboard">🏠<div class="navlabel">Home</div></button>
    <button class="navbtn" data-section="assignments" title="Assignments">📝<div class="navlabel">Assign</div></button>
    <button class="navbtn" data-section="habits" title="Habits">✅<div class="navlabel">Habits</div></button>
    <button class="navbtn" data-section="leetcode" title="LeetCode">💻<div class="navlabel">LC</div></button>
    <button class="navbtn" data-section="resources" title="Resources">📚<div class="navlabel">Res</div></button>
    <button class="navbtn" data-section="notes" title="Notes & Flashcards">🗂️<div class="navlabel">Notes</div></button>
    <button class="navbtn" data-section="journal" title="Journal">📓<div class="navlabel">Journal</div></button>
    <button class="navbtn" data-section="expenses" title="Expenses">💸<div class="navlabel">Exp</div></button>
    <button class="navbtn" data-section="settings" title="Settings">⚙️<div class="navlabel">Set</div></button>
  </nav>

  <main class="main">
    <header>
      <h1 id="pageTitle">Dashboard</h1>
      <div style="margin-left:auto" class="tiny">Offline • data saved on this device</div>
    </header>

    <div class="container">
      <!-- -- content area -- -->
      <div id="contentArea"></div>
    </div>
  </main>
</div>

<script>
/* ---------- STORAGE KEYS ---------- */
const STORAGE = {
  assignments: 'md_assignments_v1',
  habits: 'md_habits_v1',
  quotes: 'md_quotes_v1',
  leetcode: 'md_leetcode_v1',
  resources: 'md_resources_v1',
  notes: 'md_notes_v1',
  journal: 'md_journal_v1',
  expenses: 'md_expenses_v1',
  settings: 'md_settings_v1'
};

/* ---------- UTIL ---------- */
const el = sel => document.querySelector(sel);
const elAll = sel => Array.from(document.querySelectorAll(sel));
const uid = () => Date.now() + Math.floor(Math.random()*999);
function save(key, data){ localStorage.setItem(key, JSON.stringify(data)); }
function load(key, fallback){ try{ return JSON.parse(localStorage.getItem(key))||fallback }catch(e){ return fallback } }
function fmtDate(d){ if(!d) return ''; const dt=new Date(d); return dt.toLocaleDateString(); }
function fmtDateISO(d){ if(!d) return ''; const dt=new Date(d); return dt.toISOString().slice(0,10); }

/* ---------- NAV ---------- */
elAll('.navbtn').forEach(btn=>{
  btn.addEventListener('click', e=>{
    elAll('.navbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const section = btn.dataset.section;
    openSection(section);
  });
});

/* ---------- RENDER SECTIONS ---------- */
function openSection(name){
  document.getElementById('pageTitle').textContent = {
    dashboard:'Dashboard', assignments:'Assignments', habits:'Habits & Fitness',
    leetcode:'LeetCode & Study', resources:'Exam Resources', notes:'Notes & Flashcards',
    journal:'Journal & Mood', expenses:'Expenses', settings:'Settings'
  }[name] || 'Dashboard';
  const content = document.getElementById('contentArea');
  content.innerHTML = ''; // clear
  if(name==='dashboard') return renderDashboard(content);
  if(name==='assignments') return renderAssignments(content);
  if(name==='habits') return renderHabits(content);
  if(name==='leetcode') return renderLeetcode(content);
  if(name==='resources') return renderResources(content);
  if(name==='notes') return renderNotes(content);
  if(name==='journal') return renderJournal(content);
  if(name==='expenses') return renderExpenses(content);
  if(name==='settings') return renderSettings(content);
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(root){
  const assignments = load(STORAGE.assignments,[]);
  const upcoming = assignments.filter(a=> new Date(a.due) - Date.now() <= 7*24*60*60*1000 && new Date(a.due) >= Date.now()).slice(0,3);
  const streak = load(STORAGE.leetcode,[]).streak || 0; // slight format
  const habits = load(STORAGE.habits, {today:{}}).today || {};
  const savedQuotes = load(STORAGE.quotes,[]);

  root.innerHTML = `
    <div class="card section-title">
      <div>
        <div class="kpi">
          <div class="pill">Streak: <strong id="dashStreak">${streak}</strong>d</div>
          <div class="pill">Assignments: <strong id="dashAssign">${assignments.length}</strong></div>
        </div>
        <div style="margin-top:10px" class="tiny">Today's quick view</div>
      </div>
      <div class="tiny" style="text-align:right">
        <button onclick="openSection('assignments')">Open Assignments</button>
        <button onclick="openSection('leetcode')">Open LC</button>
      </div>
    </div>

    <div class="row">
      <div class="card" style="flex:1">
        <h3>Today's Quote</h3>
        <div id="dashQuote" class="tiny">${savedQuotes[0]?.text || sampleQuotes()[0]}</div>
        <div style="margin-top:8px" class="flex">
          <button onclick="nextDashQuote()">Next</button>
          <button onclick="saveDashQuote()">Save</button>
        </div>
      </div>

      <div class="card" style="width:300px">
        <h3>Due in 7 days</h3>
        <div id="dashDue">${upcoming.length ? upcoming.map(a=>`<div class="tiny">${a.title} — ${fmtDate(a.due)}</div>`).join('') : '<div class="tiny">No upcoming due</div>'}</div>
      </div>
    </div>

    <div class="row">
      <div class="card" style="flex:1">
        <h3>Habits today</h3>
        <div class="tiny">Badham: <strong>${habits.badham? '✔':'—'}</strong> • Read: <strong>${habits.read? '✔':'—'}</strong> • Water: <strong>${habits.water||0}</strong></div>
        <div style="margin-top:8px"><button onclick="openSection('habits')">Update habits</button></div>
      </div>

      <div class="card" style="width:320px">
        <h3>Quick actions</h3>
        <div class="flex" style="flex-direction:column">
          <button onclick="openSection('notes')">Open Notes / Flashcards</button>
          <button onclick="openSection('resources')">Open Resources</button>
          <button onclick="openSection('journal')">Write Journal</button>
        </div>
      </div>
    </div>
  `;
}

/* ---------- ASSIGNMENTS ---------- */
function renderAssignments(root){
  const assignments = load(STORAGE.assignments,[]);
  root.innerHTML = `
    <div class="card">
      <h3>Add Assignment</h3>
      <input id="assTitle" placeholder="Title (ex: OOP Lab)"/>
      <input id="assDue" type="date"/>
      <textarea id="assNotes" placeholder="Notes (optional)"></textarea>
      <div class="flex"><button onclick="addAssignment()">Add</button><button onclick="clearAssignments()">Clear all</button></div>
    </div>
    <div class="card">
      <h3>All Assignments</h3>
      <div id="assignList">${assignments.sort((a,b)=>new Date(a.due)-new Date(b.due)).map(a=>assignmentRow(a)).join('') || '<div class="tiny">No assignments</div>'}</div>
    </div>
  `;
}
function assignmentRow(a){
  return `<div class="list-item">
    <div>
      <strong>${a.title}</strong><div class="tiny">${fmtDate(a.due)} ${a.notes? '• '+a.notes:''}</div>
    </div>
    <div class="flex">
      <button onclick="deleteAssignment('${a.id}')">Delete</button>
    </div>
  </div>`;
}
function addAssignment(){
  const title = document.getElementById('assTitle').value.trim();
  const due = document.getElementById('assDue').value;
  const notes = document.getElementById('assNotes').value.trim();
  if(!title || !due){ alert('Title and due date required'); return; }
  const arr = load(STORAGE.assignments,[]);
  arr.push({id:uid(), title, due, notes, createdAt:Date.now()});
  save(STORAGE.assignments, arr);
  openSection('assignments');
}
function deleteAssignment(id){
  let arr = load(STORAGE.assignments,[]);
  arr = arr.filter(a=>a.id !== id);
  save(STORAGE.assignments, arr);
  openSection('assignments');
}
function clearAssignments(){ if(confirm('Clear all assignments?')){ save(STORAGE.assignments,[]); openSection('assignments'); } }

/* ---------- HABITS ---------- */
function renderHabits(root){
  const data = load(STORAGE.habits,{});
  const todayKey = fmtDateISO(new Date());
  const today = data[todayKey] || {badham:false,read:false,water:0};
  root.innerHTML = `
    <div class="card">
      <h3>Habits — ${todayKey}</h3>
      <label><input type="checkbox" id="hb1" ${today.badham? 'checked':''}/> Badham eating done?</label>
      <label><input type="checkbox" id="hb2" ${today.read? 'checked':''}/> Read today?</label>
      <div class="tiny">Water glasses: <input id="hb3" type="number" min="0" value="${today.water||0}" style="width:80px;display:inline-block;margin-left:8px"/></div>
      <div style="margin-top:8px" class="flex"><button onclick="saveHabitsToday()">Save</button><button onclick="openHistory()">History</button></div>
    </div>
    <div class="card">
      <h3>Weekly snapshot</h3>
      <div class="tiny">${renderHabitsPreview()}</div>
    </div>
  `;
}
function saveHabitsToday(){
  const data = load(STORAGE.habits,{});
  const key = fmtDateISO(new Date());
  data[key] = {badham:document.getElementById('hb1').checked, read:document.getElementById('hb2').checked, water:parseInt(document.getElementById('hb3').value||'0',10), ts:Date.now()};
  save(STORAGE.habits, data);
  alert('Habits saved');
  openSection('dashboard');
}
function renderHabitsPreview(){
  const data = load(STORAGE.habits,{});
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const k = fmtDateISO(d);
    const v = data[k];
    days.push(`${k.split('-').slice(1).join('/')} : ${v? (v.badham? 'B':'-') + ' ' + (v.read? 'R':'-') + ' W'+(v.water||0) : '—'}`);
  }
  return days.join('<br>');
}
function openHistory(){
  const data = load(STORAGE.habits,{});
  let html = '<div class="card"><h3>Habits history</h3>';
  Object.keys(data).sort().reverse().slice(0,30).forEach(k=>{
    const v = data[k];
    html += `<div class="tiny">${k}: Badham:${v.badham?'✔':'—'} Read:${v.read?'✔':'—'} Water:${v.water||0}</div>`;
  });
  html += '</div>';
  document.getElementById('contentArea').innerHTML = html;
}

/* ---------- LEE TCODE & STUDY ---------- */
function renderLeetcode(root){
  const data = load(STORAGE.leetcode,{entries:[],streak:0});
  root.innerHTML = `
    <div class="card">
      <h3>LeetCode / Study</h3>
      <div class="tiny">Current streak: <strong id="streakShow">${data.streak||0}</strong> days</div>
      <div style="margin-top:8px" class="flex">
        <button onclick="incStreak()">+1 Streak</button>
        <button onclick="resetStreak()">Reset</button>
      </div>
      <hr/>
      <input id="lcDate" type="date"/>
      <input id="lcSolved" placeholder="Problems solved (number)"/>
      <div style="margin-top:8px"><button onclick="addLCEntry()">Add entry</button></div>
    </div>
    <div class="card">
      <h3>History</h3>
      <div id="lcHistory" class="tiny">${(data.entries||[]).map(e=>`<div>${e.date}: ${e.solved} problems</div>`).join('') || 'No entries'}</div>
    </div>
  `;
}
function incStreak(){ const d = load(STORAGE.leetcode,{entries:[],streak:0}); d.streak = (d.streak||0)+1; save(STORAGE.leetcode,d); openSection('leetcode'); }
function resetStreak(){ if(confirm('Reset streak?')){ const d = load(STORAGE.leetcode,{entries:[],streak:0}); d.streak = 0; save(STORAGE.leetcode,d); openSection('leetcode'); } }
function addLCEntry(){
  const date = document.getElementById('lcDate').value;
  const solved = parseInt(document.getElementById('lcSolved').value||'0',10);
  if(!date){ alert('Choose a date'); return; }
  const d = load(STORAGE.leetcode,{entries:[],streak:0});
  d.entries = d.entries||[];
  d.entries.unshift({id:uid(),date,solved,ts:Date.now()});
  save(STORAGE.leetcode,d);
  openSection('leetcode');
}

/* ---------- RESOURCES ---------- */
function renderResources(root){
  const arr = load(STORAGE.resources,[]);
  root.innerHTML = `
    <div class="card">
      <h3>Add Resource</h3>
      <input id="resTitle" placeholder="Title (eg: OS notes)" />
      <input id="resLink" placeholder="External link (optional)" />
      <input id="resFile" type="file" />
      <div class="flex"><button onclick="addResource()">Add</button><button onclick="clearResources()">Clear all</button></div>
      <small>Note: storing files increases browser storage usage; prefer cloud links for large files.</small>
    </div>
    <div class="card">
      <h3>Your resources</h3>
      <div id="resList" class="tiny">${arr.map(r=>resourceRow(r)).join('') || 'No resources'}</div>
    </div>
  `;
}
function resourceRow(r){
  return `<div class="list-item">
    <div>
      <strong>${r.title || '(no title)'}</strong>
      <div class="tiny">${r.link? 'Link':'File'} ${r.fileName? '• '+r.fileName:''}</div>
    </div>
    <div class="flex">
      ${r.link? `<button onclick="openLink('${encodeURIComponent(r.link)}')">Open</button>` : ''}
      ${r.fileData? `<button onclick="downloadResource('${r.id}')">Open</button>` : ''}
      <button onclick="deleteResource('${r.id}')">Delete</button>
    </div>
  </div>`;
}
function openLink(encoded){ window.open(decodeURIComponent(encoded),'_blank'); }
async function addResource(){
  const title = document.getElementById('resTitle').value.trim();
  const link = document.getElementById('resLink').value.trim();
  const file = document.getElementById('resFile').files[0];
  const arr = load(STORAGE.resources,[]);
  let fileData = null, fileName = null;
  if(file){
    if(file.size > 3_000_000 && !confirm('File >3MB may fill browser storage. Continue?')) return;
    fileData = await readFileAsDataURL(file);
    fileName = file.name;
  }
  arr.unshift({id:uid(), title, link:file?null:link || '', link: link || '', fileData, fileName, createdAt:Date.now()});
  save(STORAGE.resources, arr);
  openSection('resources');
}
function readFileAsDataURL(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(); r.readAsDataURL(f); }); }
function downloadResource(id){
  const arr = load(STORAGE.resources,[]);
  const r = arr.find(x=>x.id===id);
  if(!r) return;
  if(r.fileData){
    const a=document.createElement('a'); a.href=r.fileData; a.download=r.fileName||'file'; a.click();
  } else if(r.link){
    window.open(r.link,'_blank');
  }
}
function deleteResource(id){ let arr=load(STORAGE.resources,[]); arr=arr.filter(x=>x.id!==id); save(STORAGE.resources,arr); openSection('resources'); }
function clearResources(){ if(confirm('Clear all resources?')){ save(STORAGE.resources,[]); openSection('resources'); } }

/* ---------- NOTES & FLASHCARDS ---------- */
function renderNotes(root){
  const notes = load(STORAGE.notes, {cards:[],notes:[]});
  root.innerHTML = `
    <div class="card">
      <h3>Create Flashcard</h3>
      <input id="cardQ" placeholder="Question / Topic"/>
      <textarea id="cardA" placeholder="Answer / Notes"></textarea>
      <div class="flex"><button onclick="addCard()">Add Card</button><button onclick="clearCards()">Clear cards</button></div>
    </div>

    <div class="card">
      <h3>Flashcards</h3>
      <div class="tiny">Click to reveal</div>
      <div id="cardList" class="tiny">${notes.cards.map(c=>`<div class="list-item"><div><strong>${c.q}</strong></div><div><button onclick="revealCard('${c.id}')">Reveal</button> <button onclick="delCard('${c.id}')">Del</button></div></div>`).join('') || 'No cards'}</div>
    </div>

    <div class="card">
      <h3>Notes</h3>
      <textarea id="noteText" placeholder="Write a note or summary"></textarea>
      <div class="flex"><button onclick="saveNote()">Save Note</button><button onclick="viewNotes()">View Notes</button></div>
    </div>
  `;
}
function addCard(){
  const q = document.getElementById('cardQ').value.trim();
  const a = document.getElementById('cardA').value.trim();
  if(!q || !a){ alert('Q and A required'); return; }
  const data = load(STORAGE.notes, {cards:[],notes:[]});
  data.cards.unshift({id:uid(), q, a, createdAt:Date.now()});
  save(STORAGE.notes, data);
  openSection('notes');
}
function revealCard(id){
  const data = load(STORAGE.notes,{cards:[],notes:[]});
  const c = data.cards.find(x=>x.id===id);
  if(!c) return alert(c?.a || 'No answer');
  alert('A: ' + c.a);
}
function delCard(id){ let data = load(STORAGE.notes,{cards:[],notes:[]}); data.cards = data.cards.filter(x=>x.id!==id); save(STORAGE.notes,data); openSection('notes'); }
function clearCards(){ if(confirm('Clear all cards?')){ save(STORAGE.notes,{cards:[],notes:[]}); openSection('notes'); } }
function saveNote(){ const txt = document.getElementById('noteText').value.trim(); if(!txt) return alert('Note empty'); const data = load(STORAGE.notes,{cards:[],notes:[]}); data.notes.unshift({id:uid(),text:txt,ts:Date.now()}); save(STORAGE.notes,data); alert('Saved'); document.getElementById('noteText').value=''; }
function viewNotes(){ const data = load(STORAGE.notes,{cards:[],notes:[]}); if(!data.notes.length) return alert('No notes yet'); const html = data.notes.slice(0,20).map(n=>`${new Date(n.ts).toLocaleString()}: ${n.text}`).join('\n\n'); alert(html); }

/* ---------- JOURNAL & MOOD ---------- */
function renderJournal(root){
  const entries = load(STORAGE.journal,[]);
  root.innerHTML = `
    <div class="card">
      <h3>New Journal Entry</h3>
      <select id="moodSel"><option value="😊">😊 Happy</option><option value="😐">😐 Okay</option><option value="😔">😔 Sad</option><option value="😡">😡 Angry</option></select>
      <textarea id="journalText" placeholder="Write your thoughts..."></textarea>
      <div class="flex"><button onclick="saveJournal()">Save</button><button onclick="openSection('journal')">Refresh</button></div>
    </div>
    <div class="card">
      <h3>Recent entries</h3>
      <div class="tiny">${entries.slice(0,20).map(e=>`${new Date(e.ts).toLocaleString()} • ${e.mood} • ${e.text}`).join('<br><br>') || 'No entries yet'}</div>
    </div>
  `;
}
function saveJournal(){
  const mood = document.getElementById('moodSel').value;
  const text = document.getElementById('journalText').value.trim();
  const arr = load(STORAGE.journal,[]);
  arr.unshift({id:uid(),mood,text,ts:Date.now()});
  save(STORAGE.journal, arr);
  alert('Journal saved');
  openSection('journal');
}

/* ---------- EXPENSES ---------- */
function renderExpenses(root){
  const arr = load(STORAGE.expenses,[]);
  const total = arr.reduce((s,x)=>s+(x.amount||0),0);
  root.innerHTML = `
    <div class="card">
      <h3>Add Expense</h3>
      <input id="expTitle" placeholder="Title (eg: Mess)"/>
      <input id="expAmt" type="number" placeholder="Amount"/>
      <input id="expDate" type="date" value="${fmtDateISO(new Date())}"/>
      <div class="flex"><button onclick="addExpense()">Add</button><button onclick="clearExpenses()">Clear</button></div>
    </div>
    <div class="card">
      <h3>Summary</h3>
      <div class="tiny">Total spent: ₹ <strong>${total}</strong></div>
      <div style="margin-top:8px" class="tiny">${arr.slice(0,30).map(e=>`${fmtDate(e.date)} • ${e.title} • ₹${e.amount}`).join('<br>') || 'No expenses yet'}</div>
    </div>
  `;
}
function addExpense(){
  const t = document.getElementById('expTitle').value.trim();
  const a = parseFloat(document.getElementById('expAmt').value||'0');
  const d = document.getElementById('expDate').value;
  if(!t || !a || !d){ alert('All fields required'); return; }
  const arr = load(STORAGE.expenses,[]);
  arr.unshift({id:uid(), title:t, amount:a, date:d, ts:Date.now()});
  save(STORAGE.expenses,arr);
  openSection('expenses');
}
function clearExpenses(){ if(confirm('Clear all expenses?')){ save(STORAGE.expenses,[]); openSection('expenses'); } }

/* ---------- SETTINGS ---------- */
function renderSettings(root){
  const settings = load(STORAGE.settings, {theme:'default', name:''});
  root.innerHTML = `
    <div class="card">
      <h3>Settings</h3>
      <input id="setName" placeholder="Your name (optional)" value="${settings.name || ''}" />
      <div style="margin-top:8px" class="flex"><button onclick="saveSettings()">Save</button><button onclick="exportData()">Export JSON</button><button onclick="importData()">Import JSON</button></div>
      <div class="tiny" style="margin-top:8px">Exported file can be used as backup. Import will overwrite local data.</div>
    </div>
  `;
}
function saveSettings(){
  const name = document.getElementById('setName').value.trim();
  save(STORAGE.settings, {name});
  alert('Saved');
}
function exportData(){
  const data = {
    assignments: load(STORAGE.assignments,[]),
    habits: load(STORAGE.habits,{}),
    leetcode: load(STORAGE.leetcode,{}),
    resources: load(STORAGE.resources,[]),
    notes: load(STORAGE.notes,{}),
    journal: load(STORAGE.journal,[]),
    expenses: load(STORAGE.expenses,[]),
    settings: load(STORAGE.settings,{})
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'md_backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function importData(){
  const input = document.createElement('input'); input.type='file'; input.accept='application/json';
  input.onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const r = new FileReader(); r.onload = ev=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(confirm('Importing will overwrite local data. Continue?')){
          if(data.assignments) save(STORAGE.assignments,data.assignments);
          if(data.habits) save(STORAGE.habits,data.habits);
          if(data.leetcode) save(STORAGE.leetcode,data.leetcode);
          if(data.resources) save(STORAGE.resources,data.resources);
          if(data.notes) save(STORAGE.notes,data.notes);
          if(data.journal) save(STORAGE.journal,data.journal);
          if(data.expenses) save(STORAGE.expenses,data.expenses);
          if(data.settings) save(STORAGE.settings,data.settings);
          alert('Import complete');
          openSection('dashboard');
        }
      }catch(err){ alert('Invalid file'); }
    };
    r.readAsText(file);
  };
  input.click();
}

/* ---------- Small helpers / Sample quotes ---------- */
function sampleQuotes(){
  return [
    "Small steps every day add up to big results.",
    "Consistency > intensity.",
    "Learn a little every day.",
    "Fail fast, learn faster.",
    "Focus on progress, not perfection."
  ];
}
function nextDashQuote(){
  const q = sampleQuotes()[Math.floor(Math.random()*5)];
  document.getElementById('dashQuote').textContent = q;
}
function saveDashQuote(){
  let arr = load(STORAGE.quotes, []);
  const q = document.getElementById('dashQuote').textContent;
  arr.unshift({text:q,ts:Date.now()});
  save(STORAGE.quotes, arr);
  alert('Quote saved');
}

/* ---------- Init: open default ---------- */
openSection('dashboard');

/* ---------- Restore quick shortcuts: long-press note ---------- */
document.addEventListener('contextmenu', e=>{ /* noop prevent mobile weird */ });

</script>
