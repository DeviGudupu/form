<!DOCTYPE html>
<html>
<head>
    <title>Sample Form</title>
</head>
<body>
    <form action="/submit_form" method="post">
        <table>
            <tr>
                <td><label for="fn">Firstname:</label></td>
                <td><input type="text" name="fn" id="fn"><br><br></td>
            </tr>
            <tr>
                <td><label for="ln">Lastname:</label></td>
                <td><input type="text" name="ln" id="ln"><br><br></td>
            </tr>
            <tr>
                <td><label for="addr">Address:</label></td>
                <td><textarea id="addr" name="address" rows="4" cols="25"></textarea></td>
            </tr>
            <tr>
                <td><label for="pwd">Password:</label></td>
                <td><input type="password" name="pwd" id="pwd"></td>
            </tr>
            <tr>
                <td>Choose your favorite web language:</td>
                <td>
                    <input type="radio" name="fav_language" value="HTML" id="html">
                    <label for="html">HTML</label><br>
                    <input type="radio" name="fav_language" value="CSS" id="css">
                    <label for="css">CSS</label><br>
                    <input type="radio" name="fav_language" value="JavaScript" id="javascript">
                    <label for="javascript">JavaScript</label>
                </td>
            </tr>
            <tr>
                <td><label for="email">Email:</label></td>
                <td><input type="email" name="email" id="email"></td>
            </tr>
            <tr>
                <td>Hobbies:</td>
                <td>
                    <input type="checkbox" name="hb1" value="reading" id="reading"><label for="reading">Reading</label>
                    <input type="checkbox" name="hb2" value="writing" id="writing"><label for="writing">Writing</label>
                    <input type="checkbox" name="hb3" value="movies" id="movies"><label for="movies">Watching Movies</label>
                </td>
            </tr>
            <tr>
                <td><label for="fc">Choose your favorite color:</label></td>
                <td><input type="color" name="fc" id="fc"></td>
            </tr>
            <tr>
                <td><label for="dob">Date of Birth:</label></td>
                <td><input type="date" name="dob" id="dob"></td>
            </tr>
            <tr>
                <td><label for="datemax">Enter a date before 1979-12-31:</label></td>
                <td><input type="date" id="datemax" name="datemax" max="1979-12-31"></td>
            </tr>
            <tr>
                <td><label for="datemin">Enter a date after 2000-01-01:</label></td>
                <td><input type="date" id="datemin" name="datemin" min="2000-01-01"></td>
            </tr>
            <tr>
                <td>Select your country:</td>
                <td>
                    <select name="country">
                        <option value="India">India</option>
                        <option value="USA">USA</option>
                        <option value="UAE">UAE</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><input type="submit" value="Submit"></td>
                <td><input type="reset" value="Reset"></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="button" value="Click Me!" onclick="alert('Hello World!')">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
